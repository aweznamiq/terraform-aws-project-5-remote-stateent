name: Terraform
on:
  push:
    branches:
      - main
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config=environments/dev/backend.hcl \
            -input=false
      - name: Terraform Plan
        run: |
         terraform plan \
          -var-file=environments/dev/terraform.tfvars \
         -input=false
            